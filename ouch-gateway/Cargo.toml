[package]
name = "ouch-gateway"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }
matching-engine = { path = "../matching-engine" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"

# io_uring is Linux-only; the uring_sessions module is cfg-gated to match.
[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

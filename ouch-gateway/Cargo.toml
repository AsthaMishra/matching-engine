[package]
name = "ouch-gateway"
version = "0.1.0"
edition = "2024"

[features]
# Hot-path latency instrumentation (per-order clock reads + histograms +
# periodic latency logging). Off by default → zero overhead in the shipped
# binary. Enable for benchmarking: `--features metrics`.
metrics = []

[dependencies]
chrono = "0.4.44"
tokio = { version = "1", features = ["full"] }
matching-engine = { path = "../matching-engine" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hdrhistogram = "7"
io-uring = "0.7"
